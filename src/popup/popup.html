<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decant Markdown Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">🍷 <span>Decant</span></div>
      <div class="header-actions">
        <button id="options-btn" title="Settings">⚙️</button>
      </div>
    </div>

    <div id="ai-tip-banner" class="ai-tip-banner hidden">
      <span
        >💡 Exporting AI chat? For multi-turn chats &amp; code blocks, try
        <a href="https://ai-chat-exporter.covai.org/" target="_blank" id="ai-exporter-link"
          >AI Chat Exporter →</a
        ></span
      >
    </div>

    <div class="content-container">
      <!-- Loading -->
      <div id="loading" class="state-view">
        <div class="spinner"></div>
        <p>Decanting page…</p>
      </div>

      <!-- Error -->
      <div id="error-view" class="state-view hidden">
        <p class="error-msg" id="error-text">Could not extract content from this page.</p>
      </div>

      <!-- Success -->
      <div id="success-view" class="state-view hidden">
        <div class="success-icon">✓</div>
        <p class="success-title" id="success-title">Article Title</p>
        <p class="success-sub">Decanted · ready to export</p>
      </div>
    </div>

    <!-- Row 1: AI Transfer -->
    <div class="actions row-ai">
      <select id="ai-select" class="select-dropdown" title="Select AI Platform">
        <option value="chatgpt">ChatGPT</option>
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
        <option value="deepseek">DeepSeek</option>
        <option value="perplexity">Perplexity</option>
      </select>
      <button id="ai-btn" class="btn ai-btn" title="Send article prompt to AI Chat">🤖 Send to AI</button>
    </div>

    <!-- Row 2: PKM / App Transfer -->
    <div class="actions row-app">
      <select id="app-select" class="select-dropdown" title="Select PKM / Note App">
        <option value="obsidian">Obsidian</option>
        <option value="logseq">Logseq</option>
        <option value="bear">Bear</option>
        <option value="noteplan">NotePlan</option>
        <option value="drafts">Drafts</option>
      </select>
      <button id="obsidian-btn" class="btn accent" title="Open clip in PKM app">
        Open in Obsidian
      </button>
    </div>

    <hr class="popup-divider" />

    <!-- Row 3: Format Selection & Actions -->
    <div class="actions row-format">
      <select id="format-select" class="select-dropdown format-select" title="Export Format">
        <option value="md" selected>Markdown (.md)</option>
        <option value="html">HTML (.html)</option>
        <option value="json">JSON (.json)</option>
        <option value="doc">Word (.doc)</option>
        <option value="pdf">PDF (.pdf)</option>
        <option value="png">PNG (.png)</option>
      </select>

      <div id="md-actions" class="format-action-group">
        <button id="copy-btn" class="btn primary" title="Copy Markdown to clipboard">📋 Copy</button>
        <button id="download-md-btn" class="btn primary" title="Download Markdown file">⬇ Save</button>
      </div>

      <div id="preview-actions" class="format-action-group hidden">
        <button id="export-btn" class="btn export-btn" title="Preview and save in selected format">🔍 Preview &amp; Save</button>
      </div>
    </div>

    <div id="png-warning-banner" class="png-warning-banner hidden">
      ⚠️ PNG export on long articles may take a few moments. Consider PDF or Markdown for instant export.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
