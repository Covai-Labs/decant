<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorry to see you go — Decant</title>
    <meta name="description" content="Share feedback about Decant." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://decant.covai.org/uninstall-feedback.html" />
    <meta property="og:title" content="Sorry to see you go — Decant" />
    <meta property="og:description" content="Share feedback about Decant." />
    <meta property="og:image" content="https://decant.covai.org/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:site_name" content="Decant" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://decant.covai.org/uninstall-feedback.html" />
    <meta name="twitter:title" content="Sorry to see you go — Decant" />
    <meta name="twitter:description" content="Share feedback about Decant." />
    <meta name="twitter:image" content="https://decant.covai.org/og-image.png" />
    <!-- Theme bootstrap (pre-paint — prevents flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('decant-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Styles -->
    <script defer src="https://covai.org/analytics.js"></script>
    <style>
      :root,
      :root[data-theme='light'] {
        --bg-primary: #fbf7f3;
        --bg-surface: #fff;
        --bg-secondary: #f3eae1;
        --wine: #7e2037;
        --wine-dark: #4d1427;
        --wine-soft: #b75b70;
        --text-primary: #26161b;
        --text-muted: #735e63;
        --border: #4d14271f;
        --accent-glow: #7e203726;
        --line: var(--border);
        --shadow: #4d142754;
        --on-wine: #fff5f7;
        --chip-bg: #7e203712;
      }
      :root[data-theme='dark'] {
        --bg-primary: #12090d;
        --bg-surface: #1d1016;
        --bg-secondary: #26161e;
        --wine: #c44d67;
        --wine-dark: #e8859b;
        --wine-soft: #8f2d43;
        --text-primary: #f8eff2;
        --text-muted: #b09ba2;
        --border: #e2728d2e;
        --accent-glow: #c44d6740;
        --line: var(--border);
        --shadow: #00000073;
        --on-wine: #12090d;
        --chip-bg: #c44d6724;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg-primary: #12090d;
          --bg-surface: #1d1016;
          --bg-secondary: #26161e;
          --wine: #c44d67;
          --wine-dark: #e8859b;
          --wine-soft: #8f2d43;
          --text-primary: #f8eff2;
          --text-muted: #b09ba2;
          --border: #e2728d2e;
          --accent-glow: #c44d6740;
          --line: var(--border);
          --shadow: #00000073;
          --on-wine: #12090d;
          --chip-bg: #c44d6724;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
        margin: 0;
        font-family: Outfit, sans-serif;
        line-height: 1.65;
        transition:
          background-color 0.25s,
          color 0.25s;
      }
      a {
        color: inherit;
      }
      ::selection {
        background: var(--accent-glow);
      }
      .shell {
        width: min(calc(100% - 48px), var(--shell, 1120px));
        margin: 0 auto;
      }
      .site-header {
        width: min(calc(100% - 48px), var(--shell, 1120px));
        border-bottom: 1px solid var(--line);
        z-index: 50;
        background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
        backdrop-filter: blur(8px);
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin: 0 auto;
        padding: 24px 0;
        display: flex;
        position: sticky;
        top: 0;
      }
      .brand {
        color: var(--text-primary);
        letter-spacing: -0.03em;
        align-items: center;
        gap: 10px;
        font-size: 1.25rem;
        font-weight: 800;
        text-decoration: none;
        display: inline-flex;
      }
      .brand-mark {
        background: var(--wine);
        width: 32px;
        height: 32px;
        color: var(--on-wine);
        box-shadow: 0 4px 14px var(--accent-glow);
        border-radius: 50% 50% 45% 45%;
        place-items: center;
        font-family: Georgia, serif;
        font-size: 1.15rem;
        display: grid;
      }
      .brand:hover .brand-mark {
        box-shadow: 0 4px 20px var(--accent-glow);
      }
      .header-right {
        align-items: center;
        gap: 22px;
        display: flex;
      }
      nav {
        color: var(--text-muted);
        gap: 22px;
        font-size: 0.92rem;
        display: flex;
      }
      .nav-link {
        align-items: center;
        gap: 6px;
        text-decoration: none;
        display: inline-flex;
      }
      .nav-link:hover {
        color: var(--wine);
      }
      .theme-toggle {
        border: 1px solid var(--line);
        background: var(--bg-surface);
        border-radius: 999px;
        gap: 2px;
        padding: 3px;
        display: inline-flex;
      }
      .theme-toggle button {
        width: 28px;
        height: 28px;
        color: var(--text-muted);
        cursor: pointer;
        background: 0 0;
        border: 0;
        border-radius: 999px;
        place-items: center;
        transition:
          background 0.2s,
          color 0.2s;
        display: grid;
      }
      .theme-toggle button:hover {
        color: var(--wine);
      }
      .theme-toggle button[aria-pressed='true'] {
        background: var(--chip-bg);
        color: var(--wine);
      }
      .hero {
        grid-template-columns: 1fr 0.92fr;
        align-items: center;
        gap: 70px;
        min-height: 620px;
        padding-top: 76px;
        padding-bottom: 80px;
        display: grid;
      }
      .eyebrow {
        color: var(--wine);
        text-transform: uppercase;
        letter-spacing: 0.16em;
        margin: 0 0 18px;
        font-size: 0.72rem;
        font-weight: 700;
      }
      h1,
      h2,
      h3 {
        letter-spacing: -0.05em;
        margin-top: 0;
        line-height: 1.05;
      }
      h1 {
        margin-bottom: 25px;
        font-size: clamp(3rem, 7vw, 6.2rem);
      }
      h2 {
        font-size: clamp(2.4rem, 5vw, 4.4rem);
      }
      h3 {
        font-size: 1.25rem;
      }
      em {
        color: var(--wine);
        font-family: Georgia, serif;
        font-weight: 400;
      }
      .lede {
        max-width: 570px;
        color: var(--text-muted);
        font-size: 1.18rem;
      }
      .actions {
        flex-wrap: wrap;
        gap: 12px;
        margin: 30px 0 12px;
        display: flex;
      }
      .actions.center {
        justify-content: center;
      }
      .button {
        border-radius: 999px;
        align-items: center;
        gap: 14px;
        padding: 13px 22px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.2s,
          background 0.2s,
          box-shadow 0.2s;
        display: inline-flex;
      }
      .button:hover {
        transform: translateY(-2px);
      }
      .button-primary {
        background: var(--wine);
        color: var(--on-wine);
        box-shadow: 0 8px 22px var(--accent-glow);
      }
      .button-primary:hover {
        background: var(--wine-dark);
        color: var(--on-wine);
      }
      .button-ghost {
        border: 1px solid var(--line);
        color: var(--wine);
        background: var(--bg-surface);
      }
      .button-ghost:hover {
        border-color: var(--wine-soft);
      }
      .microcopy {
        color: var(--text-muted);
        font-size: 0.83rem;
      }
      .hero-art {
        background:
          radial-gradient(
            circle at 50% 35%,
            var(--accent-glow) 0,
            var(--accent-glow) 28%,
            transparent 29%
          ),
          var(--bg-secondary);
        border: 1px solid var(--line);
        border-radius: 48% 48% 18px 18px;
        place-items: center;
        min-height: 440px;
        display: grid;
        position: relative;
        transform: rotate(2deg);
      }
      .bottle {
        filter: drop-shadow(0 16px 12px var(--shadow));
        font-size: 3.6rem;
        position: absolute;
        top: 9%;
        right: 17%;
        transform: rotate(10deg);
      }
      .paper-card {
        background: var(--bg-surface);
        border: 1px solid var(--line);
        width: min(80%, 350px);
        box-shadow:
          15px 20px 0 var(--accent-glow),
          0 20px 50px var(--shadow);
        padding: 28px;
        transform: rotate(-5deg);
      }
      .paper-top {
        border-bottom: 1px solid var(--line);
        color: var(--text-muted);
        align-items: center;
        gap: 5px;
        margin-bottom: 25px;
        padding-bottom: 10px;
        font:
          0.7rem JetBrains Mono,
          monospace;
        display: flex;
      }
      .paper-top span {
        background: var(--wine-soft);
        border-radius: 50%;
        width: 7px;
        height: 7px;
      }
      .paper-top b {
        margin-left: auto;
        font-weight: 400;
      }
      .paper-card p {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.2;
      }
      .paper-card .paper-kicker {
        color: var(--wine);
        font:
          0.78rem JetBrains Mono,
          monospace;
      }
      .paper-card hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 28px 0 12px;
      }
      .paper-card small {
        color: var(--text-muted);
        font-size: 0.68rem;
      }
      .trust-strip {
        padding: 18px max(24px, calc((100% - var(--shell, 1120px)) / 2));
        background: var(--wine-dark);
        color: var(--on-wine);
        flex-wrap: wrap;
        align-items: center;
        gap: 22px;
        font-size: 0.9rem;
        display: flex;
      }
      .trust-strip span {
        color: var(--wine-soft);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-right: 12px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .trust-strip b {
        font-weight: 500;
      }
      .integrations {
        padding: 100px 0 40px;
      }
      .integration-chips {
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
        display: flex;
      }
      .integration-chip {
        border: 1px solid var(--line);
        background: var(--chip-bg);
        color: var(--text-primary);
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 0.86rem;
        font-weight: 500;
      }
      .section {
        padding: 110px 0;
      }
      .feature-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 55px;
        display: grid;
      }
      .feature-card {
        border-top: 2px solid var(--wine);
        background: var(--bg-surface);
        border-radius: 0 0 14px 14px;
        min-height: 250px;
        padding: 22px 16px 28px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        position: relative;
      }
      .feature-card:hover {
        box-shadow: 0 18px 40px var(--accent-glow);
        transform: translateY(-4px);
      }
      .feature-tag {
        color: var(--wine-soft);
        font:
          0.68rem JetBrains Mono,
          monospace;
        position: absolute;
        top: 14px;
        right: 14px;
      }
      .feature-number {
        color: var(--wine-soft);
        font:
          0.75rem JetBrains Mono,
          monospace;
      }
      .feature-icon {
        margin: 14px 0 4px;
        font-size: 1.7rem;
      }
      .feature-grid p,
      .quote-card span,
      .reading-page p {
        color: var(--text-muted);
      }
      .split-section {
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 80px;
        display: grid;
      }
      .quote-card {
        background: var(--bg-secondary);
        border: 1px solid var(--line);
        color: var(--text-primary);
        border-radius: 4px 60px;
        padding: 42px;
      }
      .quote-card p {
        font:
          1.6rem/1.35 Georgia,
          serif;
      }
      .quote-card span {
        font-size: 0.84rem;
      }
      .cta {
        text-align: center;
        padding: 90px 0 115px;
      }
      .cta p:not(.eyebrow) {
        max-width: 520px;
        color: var(--text-muted);
        margin: 0 auto 27px;
      }
      .faq-section {
        padding: 40px 0 110px;
      }
      .faq-title {
        margin-bottom: 40px;
      }
      .faq-list {
        gap: 12px;
        display: grid;
      }
      .faq-item {
        border: 1px solid var(--line);
        background: var(--bg-surface);
        border-radius: 12px;
        overflow: hidden;
      }
      .faq-item summary {
        cursor: pointer;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        font-weight: 600;
        list-style: none;
        display: flex;
      }
      .faq-item summary::-webkit-details-marker {
        display: none;
      }
      .faq-item summary:after {
        content: '+';
        color: var(--wine);
        font-family:
          JetBrains Mono,
          monospace;
        font-size: 1.3rem;
        line-height: 1;
        transition: transform 0.2s;
      }
      .faq-item[open] summary:after {
        transform: rotate(45deg);
      }
      .faq-item p {
        color: var(--text-muted);
        margin: 0;
        padding: 0 22px 20px;
        font-size: 0.95rem;
      }
      .site-footer {
        width: min(calc(100% - 48px), var(--shell, 1120px));
        border-top: 1px solid var(--line);
        color: var(--text-muted);
        margin: 0 auto;
        padding: 30px 0 45px;
        font-size: 0.85rem;
      }
      .footer-links {
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        display: flex;
      }
      .site-footer a {
        text-decoration: none;
      }
      .site-footer a:hover {
        color: var(--wine);
      }
      .footer-sep {
        opacity: 0.5;
      }
      .site-footer p {
        margin-bottom: 0;
      }
      .reading-page {
        max-width: 800px;
        padding-top: 90px;
        padding-bottom: 100px;
      }
      .reading-page.legal {
        max-width: 760px;
      }
      .reading-page h1 {
        font-size: clamp(3rem, 7vw, 5.5rem);
      }
      .reading-page h2 {
        letter-spacing: -0.03em;
        margin-top: 52px;
        font-size: 1.8rem;
      }
      .reading-page a:not(.button) {
        color: var(--wine);
        font-weight: 600;
      }
      .steps {
        margin: 0;
        padding: 20px 0 0;
        list-style: none;
      }
      .steps li {
        border-top: 1px solid var(--line);
        grid-template-columns: 70px 1fr;
        gap: 18px;
        padding: 28px 0;
        display: grid;
      }
      .steps li > span {
        color: var(--wine);
        font:
          0.8rem JetBrains Mono,
          monospace;
      }
      .steps h2 {
        margin: 0 0 8px;
      }
      .steps p {
        margin: 0;
      }
      .callout {
        border-left: 3px solid var(--wine);
        background: var(--bg-secondary);
        border-radius: 0 12px 12px 0;
        margin-top: 46px;
        padding: 24px;
      }
      .callout p {
        margin: 6px 0 0;
      }
      .updated {
        margin-top: 48px;
        font-size: 0.85rem;
      }
      @media (width<=760px) {
        .site-header {
          flex-wrap: wrap;
          align-items: flex-start;
          gap: 16px;
        }
        .header-right {
          flex-wrap: wrap;
          gap: 12px;
        }
        nav {
          gap: 12px;
          font-size: 0.82rem;
        }
        .theme-toggle {
          order: -1;
        }
        .hero,
        .split-section {
          grid-template-columns: 1fr;
          gap: 35px;
        }
        .hero {
          padding-top: 55px;
        }
        .hero-art {
          min-height: 350px;
        }
        .feature-grid {
          grid-template-columns: 1fr;
        }
        .section {
          padding: 75px 0;
        }
        .trust-strip {
          gap: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="feedback-frame">
      <iframe
        src="https://tally.so/r/rjRMxN?transparentBackground=1&formEventsForwarding=1"
        title="Decant uninstall feedback"
      ></iframe>
    </main>
  </body>
</html>
